<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Northwind Lamp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>

*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(180deg,#fdf4ff,#fff);color:#1e1b4b;min-height:100vh}
nav{display:flex;justify-content:space-between;padding:18px 40px;font-weight:700}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;max-width:1100px;margin:24px auto;padding:0 32px}
.photo{height:480px;border-radius:32px;background:linear-gradient(135deg,#c4b5fd,#f9a8d4,#fda4af);box-shadow:0 30px 80px rgba(124,58,237,.25);display:grid;place-items:center;font-size:80px}
.info h1{font-family:'Playfair Display',serif;font-size:48px;margin-bottom:10px}
.price{font-size:32px;font-weight:800;color:#7c3aed;margin-bottom:16px}
.badge{display:inline-block;background:#ede9fe;color:#6d28d9;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:14px}
p{color:#64748b;margin-bottom:18px;line-height:1.6}
.swatches{display:flex;gap:10px;margin-bottom:20px}
.swatches span{width:36px;height:36px;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn{display:block;text-align:center;padding:18px;border-radius:999px;background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 12px 30px rgba(124,58,237,.35);margin-bottom:12px}
.btn2{display:block;text-align:center;padding:16px;border-radius:999px;border:2px solid #c4b5fd;color:#6d28d9;font-weight:800;text-decoration:none}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<nav><div>Northwind</div><div>Cart (2)</div></nav>
<div class="grid">
  <div class="photo">🛋️</div>
  <div class="info">
    <div class="badge">BESTSELLER</div>
    <h1>Arc Floor Lamp</h1>
    <div class="price">$248</div>
    <p>Elevate your living room with this seamless lighting experience — unlock cozy vibes today.</p>
    <div class="swatches"><span style="background:#111"></span><span style="background:#d6d3d1"></span><span style="background:#a8a29e"></span></div>
    <a class="btn" href="#">Add to cart</a>
    <a class="btn2" href="#">Buy now</a>
  </div>
</div>

</body>
</html>
