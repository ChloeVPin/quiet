<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Northwind · Arc Floor Lamp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#fafafa;--panel:#ffffff;--panel2:#f3f3f4;--line:#e8e8ea;
  --fg:#111113;--muted:#6b6f76;--faint:#9b9fa6;
  --btn:#111113;--btn-fg:#ffffff;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{width:min(1040px,calc(100% - 48px));margin:0 auto}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:13px}
.mark{font-weight:600;font-size:14px;letter-spacing:-.02em}
.nav-r{display:flex;gap:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;padding:28px 0 64px;align-items:start}
.photo{aspect-ratio:1/1;background:var(--panel2);border-radius:0;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.info .brand{font-size:12px;color:var(--muted);margin-bottom:8px}
.info h1{font-size:28px;font-weight:510;letter-spacing:-.03em;margin-bottom:10px}
.price{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;margin-bottom:16px}
.lede{color:var(--muted);font-size:14px;max-width:36ch;margin-bottom:22px;text-wrap:pretty}
.label{font-size:12px;color:var(--muted);margin-bottom:8px}
.swatches{display:flex;gap:8px;margin-bottom:22px}
.swatch{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);cursor:pointer;background:var(--sw)}
.swatch.on{outline:2px solid var(--fg);outline-offset:2px}
.actions{display:flex;gap:10px;margin-bottom:20px}
.btn{
  display:inline-flex;align-items:center;font:500 13px/1 Inter,system-ui,sans-serif;
  border-radius:8px;padding:10px 14px;border:0;cursor:pointer;
  transition:transform 120ms var(--ease);
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--btn-fg)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.meta{font-size:12px;color:var(--muted);line-height:1.7}
.meta div{margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="mark">Northwind</div>
    <div class="nav-r"><a href="#">Furniture</a><a href="#">Lighting</a><a href="#">Cart · 2</a></div>
  </nav>
  <div class="grid">
    <div class="photo">
      <img src="assets/arc-floor-lamp.jpg" alt="Arc floor lamp over a leather chair"/>
    </div>
    <div class="info">
      <div class="brand">Lighting</div>
      <h1>Arc Floor Lamp</h1>
      <div class="price">$248</div>
      <p class="lede">Steel arc, linen shade, in-line dimmer. Ships in 3 to 5 days from Oakland.</p>
      <div class="label">Finish</div>
      <div class="swatches">
        <button class="swatch on" style="--sw:#1a1a1a" aria-label="Matte black"></button>
        <button class="swatch" style="--sw:#d8d4ce" aria-label="Soft clay"></button>
        <button class="swatch" style="--sw:#8a8580" aria-label="Stone"></button>
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="#">Add to cart</a>
        <a class="btn btn-ghost" href="#">Save</a>
      </div>
      <div class="meta">
        <div>In stock</div>
        <div>Free shipping over $150</div>
        <div>30-day returns</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
