<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pennyrile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"/>
<style>

:root{
  --bg:#08090a;--panel:#0f1011;--panel2:#161719;--line:#23252a;
  --fg:#e5e5e6;--muted:#8a8f98;--faint:#5c616a;
  --accent:#5e6ad2;--green:#4cb782;--amber:#f2c94c;--red:#eb5757;
  --btn:#e5e5e6;--btn-fg:#08090a;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.btn{display:inline-flex;align-items:center;justify-content:center;font:500 13px/1 Inter,system-ui,sans-serif;border-radius:8px;padding:8px 12px;border:0;cursor:pointer;transition:transform 120ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--btn-fg)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn-block{width:100%;padding:10px 12px}

body{background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:min(560px,calc(100% - 48px));margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 0}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.mark{font-size:14px;font-weight:600;letter-spacing:-.02em}
.nav-r{font-size:13px;color:var(--muted)}
h1{font-size:clamp(28px,4vw,36px);font-weight:510;letter-spacing:-.035em;line-height:1.1;margin-bottom:12px;text-wrap:balance;max-width:14ch}
.lede{color:var(--muted);font-size:15px;max-width:38ch;margin-bottom:28px;text-wrap:pretty}
form{display:flex;gap:8px;align-items:stretch;max-width:440px}
input{flex:1;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:14px/1.4 Inter,system-ui,sans-serif}
input:focus{outline:2px solid var(--fg);outline-offset:1px}
form .btn{height:40px;padding:0 14px;border-radius:8px}
.meta{font-size:12px;color:var(--faint);margin-top:20px;margin-bottom:0;font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--line);padding:28px 0 0;margin-top:56px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <div class="mark">Pennyrile</div>
  </nav>
  <h1>Private beta for research teams</h1>
  <p class="lede">Pennyrile is a quiet workspace for literature review. Join the waitlist for the next cohort.</p>
  <form>
    <input type="email" placeholder="you@lab.edu" aria-label="Email"/>
    <button class="btn btn-primary" type="submit">Join waitlist</button>
  </form>
  <div class="meta">2,841 on the list · Next invites Oct 28</div>
  <footer>
    <span>pennyrile.dev</span>
    <a href="#">Privacy</a>
  </footer>
</div>

</body>
</html>
