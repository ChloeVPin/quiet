<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pennyrile Waitlist</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>

*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;background:linear-gradient(160deg,#022c22,#4c1d95 50%,#831843);color:#fff;padding:24px}
.badge{display:inline-block;background:rgba(255,255,255,.15);padding:8px 16px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px}
h1{font-family:'Playfair Display',serif;font-size:56px;line-height:1.1;margin-bottom:14px;max-width:16ch}
p{opacity:.85;max-width:440px;margin:0 auto 28px;font-size:17px}
.form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
input{padding:16px 18px;border-radius:999px;border:0;min-width:260px;font-size:14px}
button{padding:16px 24px;border-radius:999px;border:0;font-weight:800;background:linear-gradient(90deg,#34d399,#a78bfa);color:#042f2e;cursor:pointer;box-shadow:0 12px 40px rgba(52,211,153,.35)}
.social{margin-top:28px;font-size:13px;opacity:.7}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<div>
  <div class="badge">Coming soon</div>
  <h1>Something magical is brewing</h1>
  <p>Join the waitlist to unlock early access and supercharge your workflow.</p>
  <div class="form"><input placeholder="you@company.com"/><button>Join now</button></div>
  <div class="social">✨ 12,482 visionaries already joined</div>
</div>

</body>
</html>
