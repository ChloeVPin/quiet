<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>404 · Orbit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"/>
<style>

*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#0f172a,#4c1d95);color:#fff;padding:24px}
.emoji{font-size:72px;margin-bottom:16px}
h1{font-size:56px;font-weight:800;background:linear-gradient(90deg,#e9d5ff,#fbcfe8);-webkit-background-clip:text;color:transparent;margin-bottom:12px}
p{opacity:.8;max-width:420px;margin:0 auto 24px;font-size:16px}
.btn{display:inline-block;padding:16px 28px;border-radius:999px;background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 12px 40px rgba(139,92,246,.4)}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<div>
  <div class="emoji">🌌</div>
  <h1>404</h1>
  <p>Oops! This page vanished into the void — let's get you back on the seamless path.</p>
  <a class="btn" href="#">Take me home</a>
</div>

</body>
</html>
