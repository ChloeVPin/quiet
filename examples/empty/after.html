<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Page not found · Orbit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"/>
<style>

:root{
  --bg:#08090a;--panel:#0f1011;--panel2:#161719;--line:#23252a;
  --fg:#e5e5e6;--muted:#8a8f98;--faint:#5c616a;
  --accent:#5e6ad2;--green:#4cb782;--amber:#f2c94c;--red:#eb5757;
  --btn:#e5e5e6;--btn-fg:#08090a;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.btn{display:inline-flex;align-items:center;justify-content:center;font:500 13px/1 Inter,system-ui,sans-serif;border-radius:8px;padding:8px 12px;border:0;cursor:pointer;transition:transform 120ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--btn-fg)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn-block{width:100%;padding:10px 12px}

body{background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line)}
.mark{font-size:14px;font-weight:600;letter-spacing:-.02em}
.nav-r{font-size:13px;color:var(--muted);display:flex;gap:16px;align-items:center}
.main{flex:1;display:grid;place-items:center;padding:48px 24px}
.box{max-width:420px;text-align:left}
.code{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:12px}
h1{font-size:28px;font-weight:510;letter-spacing:-.03em;margin-bottom:10px}
p{color:var(--muted);font-size:14px;margin-bottom:22px;max-width:36ch}
.actions{display:flex;gap:10px;align-items:center}
.links{margin-top:36px;border-top:1px solid var(--line);padding-top:18px}
.links h2{font-size:12px;color:var(--faint);margin-bottom:10px;font-weight:500}
.links a{display:block;font-size:13px;color:var(--muted);padding:6px 0}
.links a:hover{color:var(--fg)}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<nav>
  <div class="mark">Orbit</div>
  <div class="nav-r"><a href="#">Docs</a><a href="#">Status</a><a class="btn btn-primary" href="#">Sign in</a></div>
</nav>
<main class="main">
  <div class="box">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>That URL is not in this workspace. It may have been moved or you may not have access.</p>
    <div class="actions">
      <a class="btn btn-primary" href="#">Go to home</a>
      <a class="btn btn-ghost" href="#">Contact support</a>
    </div>
    <div class="links">
      <h2>Popular</h2>
      <a href="#">Docs · Getting started</a>
      <a href="#">API reference</a>
      <a href="#">Status page</a>
    </div>
  </div>
</main>

</body>
</html>
