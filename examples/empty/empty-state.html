<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Inbox · Orbit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"/>
<style>

:root{
  --bg:#08090a;--panel:#0f1011;--panel2:#161719;--line:#23252a;
  --fg:#e5e5e6;--muted:#8a8f98;--faint:#5c616a;
  --accent:#5e6ad2;--green:#4cb782;--amber:#f2c94c;--red:#eb5757;
  --btn:#e5e5e6;--btn-fg:#08090a;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.btn{display:inline-flex;align-items:center;justify-content:center;font:500 13px/1 Inter,system-ui,sans-serif;border-radius:8px;padding:8px 12px;border:0;cursor:pointer;transition:transform 120ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--btn-fg)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn-block{width:100%;padding:10px 12px}

body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:220px 1fr}
.side{background:var(--panel2);border-right:1px solid var(--line);padding:14px 10px}
.side .mark{font-weight:600;padding:6px 8px;margin-bottom:12px;font-size:13px}
.side a{display:block;padding:7px 8px;border-radius:6px;color:var(--muted);font-size:13px}
.side a.on{background:rgba(255,255,255,.06);color:var(--fg)}
.main{display:flex;flex-direction:column}
.top{padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;font-weight:500}
.empty{flex:1;display:grid;place-items:center;padding:40px;text-align:center}
.empty h1{font-size:15px;font-weight:500;margin-bottom:8px}
.empty p{font-size:13px;color:var(--muted);max-width:32ch;margin:0 auto 16px}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<aside class="side">
  <div class="mark">Orbit</div>
  <a class="on" href="#">Inbox</a>
  <a href="#">Board</a>
  <a href="#">Cycles</a>
</aside>
<div class="main">
  <div class="top">Inbox</div>
  <div class="empty">
    <div>
      <h1>Inbox zero</h1>
      <p>Mentions and assignments will show up here. Nothing waiting right now.</p>
      <a class="btn btn-primary" href="#">Go to board</a>
    </div>
  </div>
</div>

</body>
</html>
