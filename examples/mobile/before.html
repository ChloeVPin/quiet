<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=390, initial-scale=1"/>
<title>Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;min-height:844px;margin:0 auto}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(160deg,#4c1d95,#7c3aed 45%,#db2777);color:#fff;padding:18px 16px 96px;position:relative}
.status{display:flex;justify-content:space-between;font-size:12px;font-weight:700;opacity:.85;margin-bottom:18px}
.hero-card{background:rgba(255,255,255,.18);backdrop-filter:blur(16px);border-radius:28px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25);margin-bottom:18px;border:1px solid rgba(255,255,255,.25)}
.hero-card .label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;margin-bottom:8px}
.hero-card .bal{font-size:42px;font-weight:800}
.hero-card .sub{margin-top:8px;font-size:14px;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.tile{background:rgba(255,255,255,.14);border-radius:22px;padding:18px;backdrop-filter:blur(10px)}
.tile .e{font-size:26px;margin-bottom:8px}
.tile b{display:block;font-size:20px;font-weight:800}
.tile span{font-size:12px;opacity:.75}
.section{background:rgba(255,255,255,.12);border-radius:24px;padding:18px;backdrop-filter:blur(10px)}
.section h2{font-size:16px;font-weight:800;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.row:last-child{border-bottom:0}
.row .left{display:flex;gap:12px;align-items:center}
.av{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#f472b6,#a78bfa);display:grid;place-items:center;font-size:18px}
.tab{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:358px;background:rgba(15,10,40,.85);backdrop-filter:blur(20px);border-radius:24px;display:flex;justify-content:space-around;padding:14px 8px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.tab span{font-size:11px;text-align:center;opacity:.7;font-weight:700}
.tab span.on{opacity:1;color:#f0abfc}
.fab{position:fixed;right:28px;bottom:90px;width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,#f472b6,#8b5cf6);display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 12px 30px rgba(139,92,246,.5)}
</style>
</head>
<body>
  <div class="status"><span>9:41</span><span>5G · 84%</span></div>
  <div class="hero-card">
    <div class="label">✨ Total balance</div>
    <div class="bal">$4,280.50</div>
    <div class="sub">↑ Supercharged +$320 this week</div>
  </div>
  <div class="grid">
    <div class="tile"><div class="e">📥</div><b>$2,140</b><span>Income</span></div>
    <div class="tile"><div class="e">📤</div><b>$1,820</b><span>Spent</span></div>
  </div>
  <div class="section">
    <h2>Recent — seamless activity</h2>
    <div class="row"><div class="left"><div class="av">☕</div><div><b>Coffee Lab</b><div style="font-size:12px;opacity:.7">Food</div></div></div><b>-$6.50</b></div>
    <div class="row"><div class="left"><div class="av">💼</div><div><b>Payroll</b><div style="font-size:12px;opacity:.7">Income</div></div></div><b style="color:#86efac">+$2,100</b></div>
    <div class="row"><div class="left"><div class="av">🛒</div><div><b>Market</b><div style="font-size:12px;opacity:.7">Groceries</div></div></div><b>-$64.20</b></div>
    <div class="row"><div class="left"><div class="av">🚇</div><div><b>Transit</b><div style="font-size:12px;opacity:.7">Travel</div></div></div><b>-$12.00</b></div>
  </div>
  <div class="fab">+</div>
  <div class="tab">
    <span class="on">🏠<br>Home</span>
    <span>📊<br>Stats</span>
    <span>💳<br>Cards</span>
    <span>👤<br>You</span>
  </div>
</body>
</html>
