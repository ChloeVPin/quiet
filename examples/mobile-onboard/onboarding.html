<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=390, initial-scale=1"/>
<title>Fitly</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"/>
<style>

:root{
  --bg:#08090a;--panel:#0f1011;--panel2:#161719;--line:#23252a;
  --fg:#e5e5e6;--muted:#8a8f98;--faint:#5c616a;
  --accent:#5e6ad2;--green:#4cb782;--amber:#f2c94c;--red:#eb5757;
  --btn:#e5e5e6;--btn-fg:#08090a;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.btn{display:inline-flex;align-items:center;justify-content:center;font:500 13px/1 Inter,system-ui,sans-serif;border-radius:8px;padding:8px 12px;border:0;cursor:pointer;transition:transform 120ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--btn-fg)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn-block{width:100%;padding:10px 12px}

html,body{width:390px;min-height:844px;margin:0 auto}
body{background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,sans-serif;padding:14px 20px 28px;display:flex;flex-direction:column}
.time{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:18px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;margin-bottom:36px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--fg)}
h1{font-size:26px;font-weight:510;letter-spacing:-.03em;line-height:1.15;margin-bottom:10px}
.lede{font-size:14px;color:var(--muted);margin-bottom:28px;max-width:28ch}
.preview{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;margin-bottom:24px}
.preview .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.preview .row:last-child{border-bottom:0}
.preview .muted{color:var(--muted)}
.preview .ok{color:var(--green)}
.spacer{flex:1}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<div class="time">9:41</div>
<div class="dots" aria-label="Step 2 of 3"><i></i><i class="on"></i><i></i></div>
<h1>Build a short list</h1>
<p class="lede">Start with three habits. You can add more after the trial.</p>
<div class="preview">
  <div class="row"><span>Morning run</span><span class="ok">Added</span></div>
  <div class="row"><span>Read 20 minutes</span><span class="ok">Added</span></div>
  <div class="row"><span class="muted">Add a third</span><span class="muted">Optional</span></div>
</div>
<div class="spacer"></div>
<button class="btn btn-primary btn-block" type="button">Continue</button>

</body>
</html>
