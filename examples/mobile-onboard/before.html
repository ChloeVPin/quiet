<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=390, initial-scale=1"/>
<title>Fitly</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"/>
<style>

*{box-sizing:border-box;margin:0}
html,body{width:390px;min-height:844px;margin:0 auto}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(160deg,#4c1d95,#db2777);color:#fff;padding:24px 20px 40px;display:flex;flex-direction:column}
.time{font-size:12px;font-weight:700;opacity:.8;margin-bottom:40px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.emoji{font-size:64px;margin-bottom:18px}
h1{font-size:32px;font-weight:800;line-height:1.15;margin-bottom:12px}
p{opacity:.85;font-size:15px;margin-bottom:28px}
.btn{display:block;padding:18px;border-radius:999px;background:linear-gradient(90deg,#f472b6,#a78bfa);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 12px 30px rgba(167,139,250,.45);margin-bottom:12px}
.btn2{display:block;padding:16px;border-radius:999px;border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:800;text-decoration:none;text-align:center}
.price{margin-top:20px;font-size:13px;opacity:.75}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<div class="time">9:41</div>
<div class="hero">
  <div class="emoji">💪</div>
  <h1>Unlock your best self</h1>
  <p>Supercharge habits with AI coaching — seamless streaks await!</p>
  <a class="btn" href="#">Start free trial</a>
  <a class="btn2" href="#">Restore purchase</a>
  <div class="price">$9.99/mo after 7 days · Cancel anytime</div>
</div>

</body>
</html>
