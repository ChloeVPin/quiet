<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Orbit · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"/>
<style>

:root{
  --bg:#fafafa;--panel:#ffffff;--panel2:#f3f3f4;--line:#e8e8ea;
  --fg:#111113;--muted:#6b6f76;--faint:#9b9fa6;
  --accent:#5e6ad2;--green:#1f8a5b;--amber:#b58105;--red:#c43c3c;
  --btn:#111113;--btn-fg:#ffffff;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.btn{display:inline-flex;align-items:center;justify-content:center;font:500 13px/1 Inter,system-ui,sans-serif;border-radius:8px;padding:8px 12px;border:0;cursor:pointer;transition:transform 120ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--btn-fg)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn-block{width:100%;padding:10px 12px}

body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 28px 24px}
.mark{font-size:13px;font-weight:600;letter-spacing:-.01em;margin-bottom:20px}
h1{font-size:18px;font-weight:510;letter-spacing:-.02em;margin-bottom:6px}
.lede{font-size:13px;color:var(--muted);margin-bottom:22px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:14px/1.4 Inter,system-ui,sans-serif;margin-bottom:14px}
input:focus{outline:2px solid var(--fg);outline-offset:1px}
.row{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 16px;font-size:12px}
.row a{color:var(--muted)}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--faint);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.alt{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
.alt a{color:var(--fg);font-weight:500}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<div class="card">
  <div class="mark">Orbit</div>
  <h1>Sign in</h1>
  <p class="lede">Use your work email to continue.</p>
  <form>
    <label for="email">Email</label>
    <input id="email" type="email" value="maya@orbit.dev" autocomplete="username"/>
    <label for="password">Password</label>
    <input id="password" type="password" value="••••••••••••" autocomplete="current-password"/>
    <div class="row"><span></span><a href="#">Forgot password</a></div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
  <div class="divider">or</div>
  <button class="btn btn-ghost btn-block" type="button">Continue with Google</button>
  <p class="alt">No account? <a href="#">Create one</a></p>
</div>

</body>
</html>
