<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Orbit Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"/>
<style>

*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#4c1d95,#7c3aed 40%,#db2777);color:#fff}
.card{width:min(420px,92vw);background:rgba(255,255,255,.12);backdrop-filter:blur(18px);border-radius:28px;padding:36px 32px;box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2)}
h1{font-size:28px;font-weight:800;margin-bottom:8px;text-align:center}
p{text-align:center;opacity:.8;margin-bottom:24px;font-size:14px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-bottom:6px;opacity:.75}
input{width:100%;padding:14px 16px;border-radius:14px;border:0;margin-bottom:14px;font-size:14px}
.btn{width:100%;padding:16px;border-radius:999px;border:0;font-weight:800;background:linear-gradient(90deg,#f472b6,#a78bfa);color:#fff;cursor:pointer;box-shadow:0 12px 30px rgba(167,139,250,.4);margin-top:8px}
.alt{text-align:center;margin-top:18px;font-size:13px;opacity:.8}
.social{display:grid;gap:10px;margin-bottom:18px}
.social button{padding:12px;border-radius:14px;border:0;font-weight:700;background:rgba(255,255,255,.2);color:#fff;cursor:pointer}

@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>

<div class="card">
  <h1>Welcome back</h1>
  <p>Supercharge your day — sign in to unlock Orbit.</p>
  <div class="social"><button>Continue with Google</button><button>Continue with GitHub</button></div>
  <label>Email</label><input placeholder="you@company.com"/>
  <label>Password</label><input type="password" placeholder="••••••••"/>
  <button class="btn">Sign in</button>
  <div class="alt">New here? <a href="#" style="color:#fbcfe8;font-weight:700">Create account</a></div>
</div>

</body>
</html>
