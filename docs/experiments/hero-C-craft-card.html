<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --stage: #ececec;
    --card: #f6f6f6;
    --fg: #171717;
    --muted: #737373;
    --line: #dedede;
    --menu: #fff;
    --accent: #ff5a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --stage: #0c0c0c;
      --card: #161616;
      --fg: #ededed;
      --muted: #8a8a8a;
      --line: #2a2a2a;
      --menu: #1c1c1c;
      --accent: #ff6a33;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 880px; height: 520px;
    background: var(--stage);
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--fg);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 760px; height: 420px;
    background: var(--card);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
  }
  .top {
    position: absolute; top: 22px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .mark { font-size: 12px; font-weight: 500; }
  .date { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .center {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .menu {
    width: 228px;
    background: var(--menu);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 5px;
    transform-origin: top center;
  }
  .hint { font-size: 10px; color: var(--muted); padding: 6px 9px 4px; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 9px; border-radius: 6px;
    font-size: 13px; letter-spacing: -0.01em;
  }
  .item.active { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .k { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sep { height: 1px; background: var(--line); margin: 4px 7px; }
  /* DD-style measurement */
  .rule {
    position: absolute;
    left: 0; right: 0; top: 62%;
    height: 1px;
    background: color-mix(in srgb, var(--accent) 55%, transparent);
    pointer-events: none;
  }
  .dot {
    position: absolute;
    left: 24px; top: calc(62% - 3px);
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }
  .note {
    position: absolute;
    left: 38px; top: calc(62% + 10px);
    font-size: 10px; color: var(--muted);
  }
  .note b { color: var(--accent); font-weight: 500; }
  .foot {
    position: absolute; bottom: 18px; left: 24px; right: 24px;
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="mark">Quiet</div>
      <div class="date">Menu · origin-aware</div>
    </div>
    <div class="center">
      <div class="menu">
        <div class="hint">Actions</div>
        <div class="item active"><span>Open board</span><span class="k">↵</span></div>
        <div class="item"><span>Invite…</span><span class="k">⌘I</span></div>
        <div class="item"><span>Copy link</span><span class="k">⌘C</span></div>
        <div class="sep"></div>
        <div class="item"><span>Archive</span><span class="k"></span></div>
      </div>
    </div>
    <div class="rule"></div>
    <div class="dot"></div>
    <div class="note">transform-origin <b>top</b> · not center</div>
    <div class="foot">
      <span>Craft specimen</span>
      <span>press 0.97 · ≤300ms</span>
    </div>
  </div>
</body>
</html>
