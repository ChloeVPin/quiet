<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500&family=Newsreader:opsz,ital,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f3ee;
    --fg: #121211;
    --muted: #6a6963;
    --rule: #dcdad2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0b;
      --fg: #f3f2ed;
      --muted: #9a9890;
      --rule: #2c2c28;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    width: 880px;
    height: 420px;
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .brand {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .meta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .title {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 500;
    font-size: 72px;
    line-height: 0.95;
    letter-spacing: -0.035em;
    text-wrap: balance;
    max-width: 9ch;
  }
  .bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: end;
    border-top: 1px solid var(--rule);
    padding-top: 28px;
  }
  .line {
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 36ch;
    text-wrap: pretty;
  }
  .rule-note {
    font-size: 13px;
    color: var(--fg);
    text-align: right;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand">Quiet</div>
      <div class="meta">UI skill · v1</div>
    </div>
    <h1 class="title">Make it quieter.</h1>
    <div class="bottom">
      <p class="line">An agent skill for interfaces that could sit next to rauno.me — near-monochrome, decided type, motion under 300ms.</p>
      <p class="rule-note">Interaction detail first.<br />Ornament never.</p>
    </div>
  </div>
</body>
</html>
